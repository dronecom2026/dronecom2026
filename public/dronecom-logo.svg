<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DroneCom Drone Icon</title>
  <desc>Transparent SVG drone icon with Wi-Fi signal.</desc>

  <defs>
    <linearGradient id="mainBlue" x1="350" y1="230" x2="850" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EDCFF"/>
      <stop offset="0.48" stop-color="#087CDC"/>
      <stop offset="1" stop-color="#062D78"/>
    </linearGradient>

    <linearGradient id="deepBlue" x1="380" y1="270" x2="820" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#008BE8"/>
      <stop offset="1" stop-color="#052664"/>
    </linearGradient>

    <linearGradient id="lightBlue" x1="300" y1="210" x2="900" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9FBFF"/>
      <stop offset="0.48" stop-color="#35D4FF"/>
      <stop offset="1" stop-color="#006FD2"/>
    </linearGradient>

    <radialGradient id="lensGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 438) rotate(90) scale(47)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.32" stop-color="#68E9FF"/>
      <stop offset="0.7" stop-color="#0076D8"/>
      <stop offset="1" stop-color="#05275F"/>
    </radialGradient>

    <filter id="softShadow" x="220" y="100" width="760" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#00316F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Wi-Fi signal -->
    <path d="M535 176C571 145 629 145 665 176" stroke="url(#lightBlue)" stroke-width="17" stroke-linecap="round"/>
    <path d="M560 208C582 191 618 191 640 208" stroke="url(#lightBlue)" stroke-width="15" stroke-linecap="round"/>
    <path d="M582 238C593 230 607 230 618 238" stroke="url(#lightBlue)" stroke-width="13" stroke-linecap="round"/>

    <!-- Center mast -->
    <path d="M600 258V346" stroke="url(#deepBlue)" stroke-width="27" stroke-linecap="round"/>
    <path d="M565 355C586 343 614 343 635 355" stroke="url(#deepBlue)" stroke-width="20" stroke-linecap="round"/>

    <!-- Main arms -->
    <path d="M404 356C461 325 532 309 600 309C668 309 739 325 796 356"
          stroke="url(#deepBlue)" stroke-width="29" stroke-linecap="round"/>
    <path d="M406 358L313 328" stroke="url(#deepBlue)" stroke-width="28" stroke-linecap="round"/>
    <path d="M794 358L887 328" stroke="url(#deepBlue)" stroke-width="28" stroke-linecap="round"/>

    <!-- Left rotor -->
    <g>
      <ellipse cx="295" cy="322" rx="87" ry="42" fill="none" stroke="#2ECFFF" stroke-width="16"/>
      <ellipse cx="295" cy="322" rx="62" ry="18" fill="#E5FCFF" opacity="0.92"/>
      <ellipse cx="295" cy="322" rx="78" ry="34" fill="none" stroke="#0067C8" stroke-width="6" opacity="0.48"/>
      <path d="M246 322C276 311 314 311 344 322" stroke="#70EAFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <circle cx="295" cy="322" r="21" fill="url(#deepBlue)"/>
      <circle cx="295" cy="322" r="8" fill="#BAF8FF"/>
    </g>

    <!-- Right rotor -->
    <g>
      <ellipse cx="905" cy="322" rx="87" ry="42" fill="none" stroke="#2ECFFF" stroke-width="16"/>
      <ellipse cx="905" cy="322" rx="62" ry="18" fill="#E5FCFF" opacity="0.92"/>
      <ellipse cx="905" cy="322" rx="78" ry="34" fill="none" stroke="#0067C8" stroke-width="6" opacity="0.48"/>
      <path d="M856 322C886 311 924 311 954 322" stroke="#70EAFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <circle cx="905" cy="322" r="21" fill="url(#deepBlue)"/>
      <circle cx="905" cy="322" r="8" fill="#BAF8FF"/>
    </g>

    <!-- Drone body -->
    <path d="M390 380C445 326 522 300 600 300C678 300 755 326 810 380C769 449 687 492 600 492C513 492 431 449 390 380Z"
          fill="url(#mainBlue)"/>

    <!-- Body highlight -->
    <path d="M445 374C488 345 544 330 600 330C656 330 712 345 755 374C717 405 664 421 600 421C536 421 483 405 445 374Z"
          fill="#E6FEFF" opacity="0.82"/>
    <path d="M462 389C501 406 551 415 600 415C649 415 699 406 738 389"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.58"/>

    <!-- Landing legs -->
    <path d="M514 481C489 510 478 541 475 570" stroke="url(#deepBlue)" stroke-width="23" stroke-linecap="round"/>
    <path d="M686 481C711 510 722 541 725 570" stroke="url(#deepBlue)" stroke-width="23" stroke-linecap="round"/>
    <path d="M477 570C497 557 516 550 536 546" stroke="#38D6FF" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <path d="M723 570C703 557 684 550 664 546" stroke="#38D6FF" stroke-width="10" stroke-linecap="round" opacity="0.72"/>

    <!-- Camera lens -->
    <circle cx="600" cy="438" r="50" fill="#FFFFFF"/>
    <circle cx="600" cy="438" r="38" fill="url(#lensGradient)"/>
    <circle cx="600" cy="438" r="23" fill="none" stroke="#EFFFFF" stroke-width="6"/>
    <circle cx="584" cy="421" r="8" fill="#FFFFFF" opacity="0.92"/>
  </g>
</svg>
